<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoveShare · Mis viajes</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/mis_viajes.css" />
</head>
<body class="mv-page">

  <nav class="navbar">
    <div class="navbar__inner">
      <div class="navbar__brand">
        <a class="navbar__logo-icon" href="/dashboard" aria-label="Ir al dashboard">
          <img src="/assets/moveshare-logo-dark.png" alt="MoveShare" />
        </a>
      </div>
      <div class="navbar__center">
        <div class="role-badge"><span>Pasajero</span></div>
      </div>
      <div class="navbar__actions">
        <a class="btn btn--ghost btn--sm" href="/dashboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Dashboard
        </a>
      </div>
    </div>
  </nav>

  <main class="mv">
    <header class="mv-header">
      <div>
        <h1 class="mv-header__title">Mis viajes</h1>
        <p class="mv-header__subtitle" id="mv-greeting">Revisa tus solicitudes, reservas, conductores frecuentes y reclamos.</p>
      </div>
      <button class="btn btn--ghost btn--sm" id="mv-demo-btn" type="button" title="Genera datos de ejemplo para tu usuario">
        Cargar datos de demostración
      </button>
    </header>

    <div class="mv-tabs" role="tablist">
      <button class="mv-tab mv-tab--active" role="tab" data-tab="solicitudes">Solicitudes <span class="mv-tab__count" id="count-solicitudes"></span></button>
      <button class="mv-tab" role="tab" data-tab="reservas">Reservas <span class="mv-tab__count" id="count-reservas"></span></button>
      <button class="mv-tab" role="tab" data-tab="conductores">Conductores frecuentes <span class="mv-tab__count" id="count-conductores"></span></button>
      <button class="mv-tab" role="tab" data-tab="reclamos">Reclamos <span class="mv-tab__count" id="count-reclamos"></span></button>
    </div>

    <!-- US15 · Visualizar estado de solicitudes -->
    <section class="mv-panel" id="panel-solicitudes" role="tabpanel">
      <div class="mv-panel__head">
        <h2>Estado de mis solicitudes</h2>
        <select class="form-input form-select mv-filter" id="filtro-solicitudes" aria-label="Filtrar solicitudes">
          <option value="todas">Todas</option>
          <option value="pendiente">Pendientes</option>
          <option value="aceptada">Aceptadas</option>
          <option value="rechazada">Rechazadas</option>
          <option value="cancelada">Canceladas</option>
          <option value="expirada">Expiradas</option>
        </select>
      </div>
      <div class="mv-summary" id="resumen-solicitudes"></div>
      <div class="mv-list" id="lista-solicitudes"></div>
    </section>

    <!-- US17 · Visualizar reservas · US35 · Confirmar participación -->
    <section class="mv-panel" id="panel-reservas" role="tabpanel" hidden>
      <div class="mv-panel__head">
        <h2>Mis reservas</h2>
        <div class="mv-chips" id="filtros-reservas"></div>
      </div>
      <div class="mv-list" id="lista-reservas"></div>
    </section>

    <!-- US30 · Contactar conductores frecuentes -->
    <section class="mv-panel" id="panel-conductores" role="tabpanel" hidden>
      <div class="mv-panel__head">
        <h2>Conductores frecuentes</h2>
        <span class="mv-hint" id="hint-conductores"></span>
      </div>
      <div class="mv-list mv-list--grid" id="lista-conductores"></div>
    </section>

    <!-- US37 · Consultar estado del reclamo -->
    <section class="mv-panel" id="panel-reclamos" role="tabpanel" hidden>
      <div class="mv-panel__head">
        <h2>Mis reclamos</h2>
      </div>
      <!-- Búsqueda con 5 campos: código, estado, categoría, fecha desde y fecha hasta -->
      <form class="mv-filters" id="form-buscar-reclamo" novalidate>
        <div class="form-group">
          <label class="form-label" for="f-codigo">Código</label>
          <input class="form-input" id="f-codigo" name="codigo" placeholder="REC-2026-000001" autocomplete="off" maxlength="15" />
        </div>
        <div class="form-group">
          <label class="form-label" for="f-estado">Estado</label>
          <select class="form-input form-select" id="f-estado" name="estado">
            <option value="todos">Todos</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-categoria">Categoría</label>
          <select class="form-input form-select" id="f-categoria" name="categoria">
            <option value="todas">Todas</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-desde">Desde</label>
          <input class="form-input" type="date" id="f-desde" name="desde" />
        </div>
        <div class="form-group">
          <label class="form-label" for="f-hasta">Hasta</label>
          <input class="form-input" type="date" id="f-hasta" name="hasta" />
        </div>
        <div class="mv-filters__actions">
          <button class="btn btn--primary btn--sm" type="submit">Buscar</button>
          <button class="btn btn--ghost btn--sm" type="button" id="btn-limpiar-reclamos">Limpiar</button>
        </div>
      </form>
      <div class="form-message form-message--error" id="error-reclamos" style="display:none;"></div>
      <div class="mv-summary" id="resumen-reclamos"></div>
      <div class="mv-list" id="lista-reclamos"></div>
    </section>
  </main>

  <!-- Modal genérico -->
  <div class="mv-modal" id="mv-modal" hidden>
    <div class="mv-modal__box" role="dialog" aria-modal="true" aria-labelledby="mv-modal-title">
      <div class="mv-modal__header">
        <h3 id="mv-modal-title">Detalle</h3>
        <button class="mv-modal__close" type="button" data-close-modal aria-label="Cerrar">&times;</button>
      </div>
      <div class="mv-modal__body" id="mv-modal-body"></div>
    </div>
  </div>

  <div class="mv-toast" id="mv-toast" hidden></div>

  <script src="/js/misViajes.js"></script>
</body>
</html>
