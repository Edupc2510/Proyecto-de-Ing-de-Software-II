<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Recuperar contraseña · MoveShare</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/password_recovery.css" />
</head>
<body class="recovery-page">
  <main class="auth-card recovery-card">
    <img src="/assets/moveshare-logo-dark.png" alt="MoveShare" class="recovery-logo" />
    <h1 class="auth-form__title" id="recovery-title">Recuperar contraseña</h1>
    <p class="auth-form__subtitle" id="recovery-description">Te enviaremos un enlace a tu correo registrado.</p>

    <form id="request-form" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="recovery-email">Correo electrónico</label>
        <input class="form-input" id="recovery-email" name="email" type="email" autocomplete="email" maxlength="254" required />
      </div>
      <button class="btn btn--primary btn--full" type="submit">Enviar enlace</button>
    </form>

    <form id="reset-form" class="auth-form" hidden>
      <div class="form-group">
        <label class="form-label" for="new-password">Nueva contraseña</label>
        <input class="form-input" id="new-password" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="72" aria-describedby="password-hint" required />
        <small id="password-hint">Mínimo 6 caracteres. Evita usar una contraseña que ya uses en otro servicio.</small>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirmar contraseña</label>
        <input class="form-input" id="confirm-password" name="confirmation" type="password" autocomplete="new-password" minlength="6" maxlength="72" required />
      </div>
      <button class="btn btn--primary btn--full" type="submit">Guardar contraseña</button>
    </form>
    <div id="recovery-message" class="form-message" role="status" aria-live="polite" hidden></div>
    <p class="auth-switch"><a href="/auth/forgot-password" id="request-again" hidden>Solicitar otro enlace</a></p>
    <p class="auth-switch"><a href="/login">Volver a iniciar sesión</a></p>
  </main>
  <script src="/js/password_recovery.js"></script>
</body>
</html>
